name: Deploy personal website to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  scholar:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.sync.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test Scholar parsing and failure handling
        run: python3 -m unittest discover -s tests -p test_scholar.py
      - name: Refresh and save the public Scholar snapshot
        id: sync
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_scholar.py --publish
      - name: Keep the previous snapshot if Scholar is unavailable
        if: steps.sync.outcome == 'failure'
        run: echo "::warning::Scholar refresh failed. The site will keep its last saved data and update date."

  build:
    needs: scholar
    if: ${{ !cancelled() && (needs.scholar.result == 'success' || needs.scholar.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.scholar.outputs.revision || github.sha }}
          persist-credentials: false
      - name: Stage the static site
        run: python3 scripts/build.py
      - name: Validate public files and security policies
        run: python3 scripts/check_site.py
      - name: Check security regression canaries
        run: python3 -m unittest discover -s tests
      - name: Check Scholar metrics and publication rendering
        run: node tests/scholar-ui.js
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
