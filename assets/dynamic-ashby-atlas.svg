<svg xmlns="http://www.w3.org/2000/svg" width="600" height="360" viewBox="0 0 600 360" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Ashby Atlas</title>
  <desc id="desc">A schematic material map. The clusters illustrate the atlas concept and do not represent measurements.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#f0effb"/><stop offset="1" stop-color="#e7f3f1"/></linearGradient>
    <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#9a75d5"/><stop offset="1" stop-color="#7057b2"/></linearGradient>
  </defs>
  <path fill="url(#background)" d="M0 0h600v360H0z"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="130" y="55" fill="#706583" font-size="9" letter-spacing="2.1">A MAP OF MATERIALS UNDER SHOCK</text>
    <text x="128" y="86" fill="#292235" font-size="25" font-weight="600" letter-spacing="-.7">Dynamic Ashby Atlas.</text>
    <g fill="none" stroke="#b8b8cc" stroke-width=".7" opacity=".4">
      <path d="M130 135h360M130 175h360M130 215h360M190 110v145M250 110v145M310 110v145M370 110v145M430 110v145"/>
    </g>
    <path d="M130 110v145h360" fill="none" stroke="#8e879f" stroke-width="1.2"/>
    <g transform="rotate(-24 310 178)">
      <ellipse cx="205" cy="192" rx="47" ry="21" fill="#78bcb4" fill-opacity=".25" stroke="#65a89f" stroke-opacity=".55"/>
      <ellipse cx="306" cy="172" rx="66" ry="28" fill="url(#purple)" fill-opacity=".2" stroke="#8b70c1" stroke-opacity=".55"/>
      <ellipse cx="416" cy="151" rx="44" ry="22" fill="#d69ba8" fill-opacity=".25" stroke="#c78c9d" stroke-opacity=".55"/>
      <g fill="#579e96"><circle cx="188" cy="193" r="3.5"/><circle cx="204" cy="188" r="3.5"/><circle cx="218" cy="198" r="3.5"/></g>
      <g fill="#8663bf"><circle cx="275" cy="181" r="3.5"/><circle cx="298" cy="164" r="3.5"/><circle cx="319" cy="181" r="3.5"/><circle cx="339" cy="169" r="3.5"/></g>
      <g fill="#c28398"><circle cx="402" cy="158" r="3.5"/><circle cx="419" cy="143" r="3.5"/><circle cx="432" cy="156" r="3.5"/></g>
    </g>
    <text x="310" y="280" fill="#706583" font-size="8" letter-spacing="1.5" text-anchor="middle">HUGONIOT ELASTIC LIMIT →</text>
    <text transform="translate(109 184) rotate(-90)" fill="#706583" font-size="8" letter-spacing="1.5" text-anchor="middle">SPALL STRENGTH →</text>
    <text x="310" y="316" fill="#81798e" font-size="7.5" letter-spacing="1.2" text-anchor="middle">SCHEMATIC · NOT MEASUREMENTS</text>
  </g>
</svg>
